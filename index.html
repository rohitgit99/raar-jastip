<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RAAR JASTIP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  window.tailwind = window.tailwind || {};
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          bg: 'var(--bg)', card: 'var(--card)', ink: 'var(--fg)', muted: 'var(--muted)',
          line: 'var(--line)', soft: 'var(--soft)', acc: 'var(--accent)', 'acc-h': 'var(--accent-h)',
          ann: 'var(--ann-bg)'
        }
      }
    }
  };
</script>
<style>
  /* Layout: sticky store header over a single-column storefront; catalog grid 2 -> 3 -> 4 columns; cart as a right-hand drawer. */
  :root {
    --bg: #fafaf9;          /* stone-50 */
    --card: #ffffff;
    --fg: #292524;          /* stone-800 */
    --muted: #78716c;       /* stone-500 */
    --line: #e7e5e4;        /* stone-200 */
    --soft: #f5f5f4;        /* stone-100 */
    --accent: #059669;      /* emerald-600 */
    --accent-h: #047857;    /* emerald-700 */
    --ann-bg: #1c1917;
    --tile-l1: 90%;
    --tile-l2: 82%;
    --tile-ink: 28%;
    --font-display: 'Bricolage Grotesque', 'Trebuchet MS', system-ui, sans-serif;
    --font-body: 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141211; --card: #1e1b19; --fg: #f5f5f4; --muted: #a8a29e; --line: #33302d; --soft: #292524;
      --accent: #047857; --accent-h: #059669; --ann-bg: #0b0a09;
      --tile-l1: 26%; --tile-l2: 20%; --tile-ink: 80%;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141211; --card: #1e1b19; --fg: #f5f5f4; --muted: #a8a29e; --line: #33302d; --soft: #292524;
    --accent: #047857; --accent-h: #059669; --ann-bg: #0b0a09;
    --tile-l1: 26%; --tile-l2: 20%; --tile-ink: 80%;
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; margin: 0; }
  .font-display { font-family: var(--font-display); }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent-h); outline-offset: 2px; }
  [data-theme="dark"] :focus-visible { outline-color: #34d399; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) :focus-visible { outline-color: #34d399; } }
  .field {
    width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; font-size: 14px; min-width: 0;
  }
  .field::placeholder { color: var(--muted); opacity: .8; }
  .field:focus { border-color: var(--accent-h); outline: none; box-shadow: 0 0 0 3px rgba(5,150,105,.2); }
  .field[aria-invalid="true"] { border-color: #dc2626; }
  .tile {
    background: linear-gradient(140deg, hsl(var(--h) 70% var(--tile-l1)), hsl(calc(var(--h) + 24) 62% var(--tile-l2)));
    color: hsl(var(--h) 45% var(--tile-ink));
  }
  .no-scrollbar { scrollbar-width: none; }
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .drawer { transition: transform .28s cubic-bezier(.3,.8,.3,1), visibility .28s; }
  .scrim { transition: opacity .25s; }
  .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s ease; }
  .faq-body[data-open="true"] { grid-template-rows: 1fr; }
  .faq-body > div { overflow: hidden; }
  @keyframes pop { from { transform: translateY(8px); opacity: 0 } to { transform: none; opacity: 1 } }
  .toast { animation: pop .22s ease both; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .drawer, .scrim, .faq-body { transition: none; }
    .toast { animation: none; }
  }
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js" crossorigin="anonymous"></script>

<script>
(function () {
  var m = [];
  if (!window.React) m.push('React');
  if (!window.ReactDOM) m.push('ReactDOM');
  if (!window.htm) m.push('htm (unpkg.com)');
  function show(title, body) {
    var r = document.getElementById('root');
    if (r && !r.children.length) {
      r.innerHTML = '<div style="font-family:system-ui,sans-serif;padding:24px;max-width:480px;margin:auto;line-height:1.5"><h2 style="margin:0 0 8px">' + title + '</h2><p>' + body + '</p></div>';
    }
  }
  if (m.length) {
    window.__missing = m;
    show('Gagal memuat pustaka', 'Bagian ini tidak bisa diunduh: ' + m.join(', ') + '. Pastikan internet aktif lalu muat ulang halaman. Kalau masih sama, kirim tulisan ini ke Claude.');
  }
  window.addEventListener('error', function (e) {
    show('Terjadi error', String(e.message || e) + ' ' + (e.filename ? '(' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
  });
})();
</script>
<script>
(function () {
  if (window.__missing) return;
  var React = window.React, ReactDOM = window.ReactDOM;
  var useState = React.useState, useEffect = React.useEffect, useMemo = React.useMemo, useRef = React.useRef;
  var html = window.htm.bind(React.createElement);

  /* ---------- Admin configuration ---------- */
  var CONFIG = {
    waNumber: '6285182671591',
    location: 'Medan, Indonesia',
    shipping: {
      cod: { id: 'cod', label: 'COD / Ambil di Medan', fee: 0, note: 'Gratis ongkir, ketemu atau ambil di Medan' },
      courier: { id: 'courier', label: 'Kurir Lokal Medan', fee: 10000, note: 'Antar ke alamat area Medan' }
    },
    sheetUrl: '', // tempel link Google Sheets (Publish to web, format CSV). Kosong = pakai daftar PRODUCTS di bawah
    closeAt: '2026-10-25T10:00:00+07:00', // close order edisi Diwali; kosongkan agar jadi tiap Sabtu
    closeDay: 6,      // Sabtu
    closeHourWib: 21  // 21:00 WIB
  };

  var CATEGORY_ORDER = ['Edisi Diwali', 'Snack & Food', 'Skincare & Beauty', 'Personal Care', 'Fashion'];
  var CAT_ICON = { 'Edisi Diwali': 'Flame', 'Snack & Food': 'Cookie', 'Skincare & Beauty': 'Sparkles', 'Personal Care': 'Droplets', 'Fashion': 'Shirt' };

  var PRODUCTS = [
    /* Edisi Diwali dan tambahan. price: null = harga dikonfirmasi admin. Isi angka (contoh price: 45000) kalau harganya sudah pasti. */
    { id: 'p11', name: 'Muruku', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 38, icon: 'Cookie' },
    { id: 'p12', name: 'Mixture', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 30, icon: 'Wheat' },
    { id: 'p13', name: 'Coklat Edisi Diwali', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 20, icon: 'Candy' },
    { id: 'p14', name: 'Vitamin', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 160, icon: 'Pill' },
    { id: 'p15', name: 'Vincci (Sepatu & Tas)', category: 'Edisi Diwali', price: null, badge: 'Request', variants: ['Model, ukuran & warna via admin'], hue: 330, icon: 'Footprints' },
    { id: 'p16', name: 'Aksesoris India (ACC India)', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 300, icon: 'Gem' },
    { id: 'p17', name: 'Perlengkapan Sembahyang', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 10, icon: 'Flame' },
    { id: 'p18', name: 'Hiasan Diwali', category: 'Edisi Diwali', price: null, badge: 'Diwali', variants: ['Varian sesuai stok'], hue: 45, icon: 'Lamp' },
    { id: 'p19', name: 'Dubai Chocolate', category: 'Snack & Food', price: null, badge: 'Viral', variants: ['Pistachio Kunafa', 'Varian lain (tanya admin)'], hue: 28, icon: 'Candy' }
  ];

  var FAQS = [
    {
      q: 'Bagaimana cara order?',
      a: ['1. Pilih barang dari katalog, atau isi form Request Barang Custom kalau barangnya tidak ada.',
          '2. Buka keranjang, isi data pemesan dan pilih pengiriman.',
          '3. Tekan "Kirim Order via WhatsApp". Pesanan tersusun otomatis, tinggal kirim ke admin.']
    },
    {
      q: 'Berapa DP dan bagaimana kalau barang habis?',
      a: ['DP minimal 50% dibayar saat admin mengonfirmasi pesananmu. Sisanya dilunasi sebelum barang dikirim atau diambil.',
          'Kalau barang habis di Malaysia, admin akan menawarkan varian pengganti. Jika kamu tidak mau, DP untuk barang tersebut dikembalikan penuh.']
    },
    {
      q: 'Berapa lama barang sampai di Medan?',
      a: ['Barang dibelikan setelah batch close, lalu dibawa ke Medan. Admin akan mengabari estimasi tanggal tiba saat konfirmasi, dan setiap perkembangan lewat WhatsApp.',
          'Setelah tiba, kamu bisa COD atau ambil di Medan (gratis), atau pakai kurir lokal Medan seharga Rp 10.000.']
    }
  ];

  /* ---------- Helpers ---------- */
  function rupiah(n) { return 'Rp ' + Math.round(n).toLocaleString('id-ID'); }

  function hashHue(str) {
    var h = 0;
    for (var i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) % 360;
    return h;
  }

  /* Pembaca CSV sederhana (mendukung tanda kutip dan koma di dalam sel) */
  function parseCSV(text) {
    var rows = [], row = [], cur = '', q = false;
    text = String(text || '').replace(/^﻿/, '');
    for (var i = 0; i < text.length; i++) {
      var c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else { q = false; } }
        else { cur += c; }
      } else if (c === '"') { q = true; }
      else if (c === ',') { row.push(cur); cur = ''; }
      else if (c === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; }
      else if (c !== '\r') { cur += c; }
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows;
  }

  /* Ubah baris sheet menjadi daftar produk. Kolom: id, nama, kategori, harga, badge, varian, stok, aktif, ikon, warna */
  function rowsToProducts(rows) {
    if (!rows || rows.length < 2) return [];
    var head = rows[0].map(function (h) { return String(h).trim().toLowerCase(); });
    function col() {
      for (var a = 0; a < arguments.length; a++) { var i = head.indexOf(arguments[a]); if (i !== -1) return i; }
      return -1;
    }
    var ix = { id: col('id'), name: col('nama', 'name'), cat: col('kategori', 'category'), price: col('harga', 'price'),
      badge: col('badge', 'label'), variants: col('varian', 'variants'), stock: col('stok', 'status'),
      active: col('aktif', 'active'), icon: col('ikon', 'icon'), hue: col('warna', 'hue') };
    function get(r, k) { return ix[k] === -1 || r[ix[k]] === undefined ? '' : String(r[ix[k]]).trim(); }
    var out = [];
    for (var n = 1; n < rows.length; n++) {
      var r = rows[n];
      var name = get(r, 'name');
      if (!name) continue;
      if (/^(tidak|no|n|false|0|off|sembunyi)$/i.test(get(r, 'active'))) continue;
      var digits = get(r, 'price').replace(/[^0-9]/g, '');
      var stockRaw = get(r, 'stock').toLowerCase();
      var variants = get(r, 'variants').split('|').map(function (v) { return v.trim(); }).filter(Boolean);
      var iconName = get(r, 'icon');
      var hasIcon = iconName && window.lucide && window.lucide.icons && window.lucide.icons[iconName];
      var hue = parseInt(get(r, 'hue'), 10);
      out.push({
        id: get(r, 'id') || ('s' + n),
        name: name,
        category: get(r, 'cat') || 'Lainnya',
        price: digits ? parseInt(digits, 10) : null,
        badge: get(r, 'badge'),
        variants: variants.length ? variants : ['Varian sesuai stok'],
        stock: /habis|sold|kosong/.test(stockRaw) ? 'habis' : (/^(po|pre)/.test(stockRaw) ? 'po' : 'ready'),
        hue: isNaN(hue) ? hashHue(name) : hue,
        icon: hasIcon ? iconName : undefined
      });
    }
    return out;
  }

  function loadBuyer() {
    try { var raw = localStorage.getItem('raar-buyer'); if (raw) return JSON.parse(raw) || {}; } catch (e) {}
    return {};
  }

  function nextClose() {
    var fixed = Date.parse(CONFIG.closeAt);
    if (fixed && fixed > Date.now()) return fixed;
    var wib = new Date(Date.now() + 7 * 3600 * 1000);
    var add = (CONFIG.closeDay - wib.getUTCDay() + 7) % 7;
    var t = Date.UTC(wib.getUTCFullYear(), wib.getUTCMonth(), wib.getUTCDate() + add, CONFIG.closeHourWib - 7, 0, 0);
    if (t <= Date.now()) t += 7 * 24 * 3600 * 1000;
    return t;
  }

  function toEl(n, k) {
    if (!Array.isArray(n) || typeof n[0] !== 'string') return null;
    var attrs = Object.assign({}, n[1] || {});
    attrs.key = k;
    var kids = Array.isArray(n[2]) ? n[2].map(function (c, i) { return toEl(c, i); }) : undefined;
    return React.createElement(n[0], attrs, kids);
  }

  function Icon(props) {
    var size = props.size || 20;
    var lib = window.lucide;
    var def = lib && lib.icons && lib.icons[props.name];
    var kids = [];
    if (Array.isArray(def)) {
      var list = typeof def[0] === 'string' ? (def[2] || []) : def;
      kids = list.map(function (n, i) { return toEl(n, i); });
    }
    return React.createElement('svg', {
      xmlns: 'http://www.w3.org/2000/svg', width: size, height: size, viewBox: '0 0 24 24',
      fill: 'none', stroke: 'currentColor', strokeWidth: props.stroke || 2,
      strokeLinecap: 'round', strokeLinejoin: 'round', className: props.className, 'aria-hidden': 'true'
    }, kids);
  }

  function loadCart() {
    try { var raw = localStorage.getItem('raar-cart'); if (raw) return JSON.parse(raw); } catch (e) {}
    return { items: [], customs: [] };
  }

  /* ---------- Countdown ---------- */
  function useCountdown(target) {
    var s = useState(Math.max(0, target - Date.now())); var left = s[0], setLeft = s[1];
    useEffect(function () {
      var id = setInterval(function () { setLeft(Math.max(0, target - Date.now())); }, 1000);
      return function () { clearInterval(id); };
    }, [target]);
    var total = Math.floor(left / 1000);
    return { d: Math.floor(total / 86400), h: Math.floor(total / 3600) % 24, m: Math.floor(total / 60) % 60, s: total % 60 };
  }

  function Countdown() {
    var target = useMemo(nextClose, []);
    var c = useCountdown(target);
    function cell(v, l) {
      return html`<span className="inline-flex items-baseline gap-0.5 rounded-md bg-white/10 px-1.5 py-0.5 tabular-nums" style=${{ fontVariantNumeric: 'tabular-nums' }}>
        <b className="font-semibold">${String(v).padStart(2, '0')}</b><span className="text-[10px] opacity-70">${l}</span></span>`;
    }
    return html`<span className="inline-flex items-center gap-1" role="timer" aria-label="Hitung mundur close order">
      ${cell(c.d, 'h')}${cell(c.h, 'j')}${cell(c.m, 'm')}${cell(c.s, 'd')}</span>`;
  }

  function AnnouncementBar() {
    return html`<div className="bg-ann text-stone-100">
      <div className="mx-auto flex max-w-6xl flex-wrap items-center justify-center gap-x-3 gap-y-1.5 px-4 py-2 text-center text-[12px] font-semibold tracking-wide">
        <span className="uppercase">PO MALAYSIA BATCH OPEN <span className="opacity-40">|</span> Close Order Segera <span className="opacity-40">|</span> Delivery Medan</span>
        <${Countdown} />
      </div>
    </div>`;
  }

  /* ---------- Header ---------- */
  function Header(props) {
    return html`<header className="sticky z-30 border-b border-line bg-bg" style=${{ top: 'env(safe-area-inset-top, 0px)' }}>
      <div className="mx-auto flex max-w-6xl items-center justify-between gap-3 px-4 py-3">
        <div className="flex min-w-0 items-center gap-2.5">
          <span className="grid h-10 w-10 shrink-0 place-items-center rounded-xl bg-acc text-white"><${Icon} name="Package" size=${20} /></span>
          <div className="min-w-0">
            <div className="font-display text-[19px] font-extrabold leading-none tracking-tight">RAAR JASTIP</div>
            <div className="mt-1 truncate text-[11.5px] text-muted">Jastip Malaysia - Medan Terpercaya</div>
          </div>
        </div>
        <button type="button" onClick=${props.onOpen} aria-label=${'Buka keranjang, ' + props.count + ' barang'}
          className="relative grid h-11 w-11 shrink-0 place-items-center rounded-xl border border-line bg-card transition hover:bg-soft">
          <${Icon} name="ShoppingBag" size=${21} />
          ${props.count > 0 && html`<span className="absolute -right-1.5 -top-1.5 grid h-5 min-w-[20px] place-items-center rounded-full bg-acc px-1 text-[11px] font-bold text-white">${props.count}</span>`}
        </button>
      </div>
    </header>`;
  }

  /* ---------- Product card ---------- */
  function ProductCard(props) {
    var p = props.product;
    var v = useState(p.variants[0]); var variant = v[0], setVariant = v[1];
    var q = useState(1); var qty = q[0], setQty = q[1];
    var iconName = p.icon || CAT_ICON[p.category] || 'Package';
    var soldOut = p.stock === 'habis';
    var askHref = 'https://wa.me/' + CONFIG.waNumber + '?text=' + encodeURIComponent('Halo RAAR JASTIP! Saya mau tanya ketersediaan: ' + p.name + ' (' + variant + '). Masih bisa dititip?');
    return html`<article className="flex min-w-0 flex-col overflow-hidden rounded-2xl border border-line bg-card">
      <div className="tile relative grid aspect-[4/3] place-items-center" style=${{ '--h': p.hue }}>
        <span className="absolute left-2 top-2 rounded-full bg-card px-2 py-0.5 text-[10.5px] font-bold uppercase tracking-wide text-ink">${p.badge}</span>
        <${Icon} name=${iconName} size=${44} stroke=${1.5} />
        <span className="absolute bottom-2 right-2.5 text-[10px] font-semibold uppercase tracking-widest opacity-70">${p.category}</span>
      </div>
      <div className="flex flex-1 flex-col gap-2.5 p-3">
        <h3 className="min-h-[2.5rem] text-[13.5px] font-semibold leading-snug" style=${{ textWrap: 'balance' }}>${p.name}</h3>
        <label className="sr-only" htmlFor=${'var-' + p.id}>Varian ${p.name}</label>
        <select id=${'var-' + p.id} className="field !py-2 !text-[13px]" value=${variant} onChange=${function (e) { setVariant(e.target.value); }}>
          ${p.variants.map(function (x) { return html`<option key=${x} value=${x}>${x}</option>`; })}
        </select>
        <div className="flex flex-wrap items-center gap-x-2 gap-y-1">
          ${p.price ? html`<div className="font-display text-[18px] font-extrabold tracking-tight">${rupiah(p.price)}</div>` : html`<div className="text-[14px] font-semibold leading-tight text-muted">Tanya harga ke admin</div>`}
          ${p.stock === 'po' && html`<span className="rounded-full bg-soft px-2 py-0.5 text-[10.5px] font-bold uppercase tracking-wide text-muted">Pre-order</span>`}
          ${soldOut && html`<span className="rounded-full bg-soft px-2 py-0.5 text-[10.5px] font-bold uppercase tracking-wide text-red-600">Habis</span>`}
        </div>
        <div className="mt-auto flex flex-col gap-2">
          <div className=${'flex items-center justify-between rounded-xl border border-line bg-soft p-1 ' + (soldOut ? 'pointer-events-none opacity-50' : '')}>
            <button type="button" aria-label="Kurangi jumlah" onClick=${function () { setQty(Math.max(1, qty - 1)); }}
              className="grid h-8 w-8 place-items-center rounded-lg bg-card transition hover:opacity-80"><${Icon} name="Minus" size=${15} /></button>
            <span className="min-w-[2ch] text-center text-[14px] font-bold tabular-nums" aria-live="polite">${qty}</span>
            <button type="button" aria-label="Tambah jumlah" onClick=${function () { setQty(Math.min(99, qty + 1)); }}
              className="grid h-8 w-8 place-items-center rounded-lg bg-card transition hover:opacity-80"><${Icon} name="Plus" size=${15} /></button>
          </div>
          <button type="button" disabled=${soldOut} onClick=${function () { props.onAdd(p, variant, qty); setQty(1); }}
            className=${'flex items-center justify-center gap-1.5 rounded-xl px-3 py-2.5 text-[13px] font-semibold transition ' + (soldOut ? 'cursor-not-allowed bg-soft text-muted' : 'bg-acc text-white hover:bg-acc-h active:scale-[.98]')}>
            <${Icon} name="ShoppingBag" size=${15} /> ${soldOut ? 'Stok Habis' : 'Tambah ke Keranjang'}
          </button>
          <a href=${askHref} target="_blank" rel="noopener noreferrer"
            className="flex items-center justify-center gap-1.5 rounded-xl border border-line px-3 py-2 text-[12.5px] font-semibold transition hover:bg-soft">
            <${Icon} name="MessageCircle" size=${14} /> Tanya dulu
          </a>
        </div>
      </div>
    </article>`;
  }

  /* ---------- Custom request form ---------- */
  function CustomRequest(props) {
    var a = useState(''), name = a[0], setName = a[1];
    var b = useState(''), store = b[0], setStore = b[1];
    var sp = useState(''), spec = sp[0], setSpec = sp[1];
    var c = useState(''), note = c[0], setNote = c[1];
    var d = useState(false), tried = d[0], setTried = d[1];

  /* ---------- App ---------- */
  function App() {
    var init = useMemo(loadCart, []);
    var s1 = useState(init.items || []); var items = s1[0], setItems = s1[1];
    var s2 = useState(init.customs || []); var customs = s2[0], setCustoms = s2[1];
    var s3 = useState(false); var open = s3[0], setOpen = s3[1];
    var s4 = useState(''); var query = s4[0], setQuery = s4[1];
    var s5 = useState('Semua'); var cat = s5[0], setCat = s5[1];
    var s6 = useState(null); var toast = s6[0], setToast = s6[1];
    var sp = useState(PRODUCTS); var products = sp[0], setProducts = sp[1];
    var toastTimer = useRef(null);

    useEffect(function () {
      try { localStorage.setItem('raar-cart', JSON.stringify({ items: items, customs: customs })); } catch (e) {}
    }, [items, customs]);

    useEffect(function () {
      if (!CONFIG.sheetUrl) return;
      var alive = true;
      fetch(CONFIG.sheetUrl, { cache: 'no-store' })
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
        .then(function (t) { var list = rowsToProducts(parseCSV(t)); if (alive && list.length) setProducts(list); })
        .catch(function () {});
      return function () { alive = false; };
    }, []);

    useEffect(function () {
      function onKey(e) { if (e.key === 'Escape') setOpen(false); }
      window.addEventListener('keydown', onKey);
      return function () { window.removeEventListener('keydown', onKey); };
    }, []);

    useEffect(function () {
      document.body.style.overflow = open ? 'hidden' : '';
      return function () { document.body.style.overflow = ''; };
    }, [open]);

    function say(msg) {
      setToast(msg);
      clearTimeout(toastTimer.current);
      toastTimer.current = setTimeout(function () { setToast(null); }, 2200);
    }

    function addToCart(p, variant, qty) {
      setItems(function (prev) {
        var found = prev.find(function (x) { return x.pid === p.id && x.variant === variant; });
        if (found) return prev.map(function (x) { return x === found ? { pid: x.pid, variant: x.variant, qty: Math.min(99, x.qty + qty) } : x; });
        return prev.concat([{ pid: p.id, variant: variant, qty: qty }]);
      });
      say(qty + ' x ' + p.name + ' masuk keranjang');
    }
    function changeQty(key, delta) {
      setItems(function (prev) {
        return prev.map(function (x) { return (x.pid + '|' + x.variant) === key ? { pid: x.pid, variant: x.variant, qty: x.qty + delta } : x; })
          .filter(function (x) { return x.qty > 0; });
      });
    }
    function removeItem(key) { setItems(function (prev) { return prev.filter(function (x) { return (x.pid + '|' + x.variant) !== key; }); }); }
    function addCustom(c) { setCustoms(function (prev) { return prev.concat([c]); }); say('Request custom masuk keranjang'); }
    function removeCustom(id) { setCustoms(function (prev) { return prev.filter(function (c) { return c.id !== id; }); }); }

    var count = items.reduce(function (t, x) { return t + (products.some(function (p) { return p.id === x.pid; }) ? x.qty : 0); }, 0) + customs.length;
    var subtotal = items.reduce(function (t, x) {
      var p = products.find(function (y) { return y.id === x.pid; });
      return t + (p ? (p.price || 0) * x.qty : 0);
    }, 0);

    var showCustomOnly = cat === 'Request Custom';
    var categories = useMemo(function () {
      var present = [];
      products.forEach(function (p) { if (present.indexOf(p.category) === -1) present.push(p.category); });
      var ordered = CATEGORY_ORDER.filter(function (c) { return present.indexOf(c) !== -1; })
        .concat(present.filter(function (c) { return CATEGORY_ORDER.indexOf(c) === -1; }));
      return ['Semua'].concat(ordered, ['Request Custom']);
    }, [products]);
    var filtered = products.filter(function (p) {
      var okCat = cat === 'Semua' || p.category === cat;
      var okQ = p.name.toLowerCase().indexOf(query.trim().toLowerCase()) !== -1;
      return okCat && okQ;
    });

    function pickCat(c) {
      setCat(c);
      if (c === 'Request Custom') {
        setTimeout(function () {
          var el = document.getElementById('request');
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 30);
      }
    }

    return html`<div className="min-h-screen bg-bg text-ink">
      <${AnnouncementBar} />
      <${Header} count=${count} onOpen=${function () { setOpen(true); }} />

      <main className="mx-auto grid max-w-6xl gap-8 px-4 pb-28 pt-5 sm:gap-10">
        <section aria-label="Cari dan filter">
          <h1 className="font-display text-[26px] font-extrabold leading-[1.1] tracking-tight sm:text-[34px]" style=${{ textWrap: 'balance' }}>Titip dari Malaysia, antar sampai Medan.</h1>
          <p className="mt-2 max-w-[56ch] text-[14px] leading-relaxed text-muted">Pilih dari katalog batch ini atau titip barang apa saja lewat Request Custom. Pesanan dikirim ke admin lewat WhatsApp.</p>
          <div className="relative mt-4">
            <span className="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-muted"><${Icon} name="Search" size=${18} /></span>
            <label htmlFor="search" className="sr-only">Cari barang</label>
            <input id="search" type="search" className="field !rounded-xl !py-3 !pl-10" placeholder="Cari nama barang, misalnya white coffee" value=${query} onChange=${function (e) { setQuery(e.target.value); }} />
          </div>
          <div className="no-scrollbar -mx-4 mt-3 flex gap-2 overflow-x-auto px-4 pb-1" role="tablist" aria-label="Kategori">
            ${categories.map(function (c) {
              var on = cat === c;
              return html`<button key=${c} type="button" role="tab" aria-selected=${on} onClick=${function () { pickCat(c); }}
                className=${'shrink-0 rounded-full border px-3.5 py-2 text-[13px] font-semibold transition ' + (on ? 'border-acc bg-acc text-white' : 'border-line bg-card hover:bg-soft')}>${c}</button>`;
            })}
          </div>
          ${cat === 'Edisi Diwali' && html`<p className="mt-3 rounded-xl bg-soft px-3.5 py-2.5 text-[13px] leading-relaxed text-muted">Edisi Diwali: harga dan stok dikonfirmasi admin lewat WhatsApp sebelum DP. Barang lain yang tidak ada di sini bisa dititip lewat Request Custom.</p>`}
        </section>

        ${!showCustomOnly && html`<section aria-label="Katalog produk">
          ${filtered.length > 0 ? html`<div className="grid grid-cols-2 gap-3 sm:gap-4 md:grid-cols-3 lg:grid-cols-4">
            ${filtered.map(function (p) { return html`<${ProductCard} key=${p.id} product=${p} onAdd=${addToCart} />`; })}
          </div>` : html`<div className="rounded-2xl border border-dashed border-line px-6 py-12 text-center">
            <p className="font-semibold">Tidak ada barang yang cocok</p>
            <p className="mt-1 text-[13px] text-muted">Coba kata kunci lain, atau titip lewat Request Custom di bawah.</p>
          </div>`}
        </section>`}

        <${CustomRequest} onAdd=${addCustom} />
        <${FAQ} />

        <footer className="border-t border-line pt-6 text-[13px] text-muted">
          <p className="font-display text-[16px] font-extrabold text-ink">RAAR JASTIP</p>
          <p className="mt-1">Jastip Malaysia - Medan. Admin WhatsApp: <span className="select-all font-semibold text-ink">+${CONFIG.waNumber}</span></p>
          <p className="mt-1">Harga bisa berubah mengikuti kurs dan harga di toko saat dibelikan. Total akhir dikonfirmasi admin.</p>
        </footer>
      </main>

      ${count > 0 && !open && html`<div className="fixed inset-x-0 bottom-0 z-20 px-4 pt-2" style=${{ paddingBottom: 'calc(env(safe-area-inset-bottom, 0px) + 12px)' }}>
        <button type="button" onClick=${function () { setOpen(true); }} className="mx-auto flex w-full max-w-md items-center justify-between gap-3 rounded-2xl bg-acc px-4 py-3.5 text-white shadow-lg transition hover:bg-acc-h">
          <span className="flex items-center gap-2 text-[14px] font-semibold"><${Icon} name="ShoppingBag" size=${18} /> Lihat Keranjang (${count})</span>
          <span className="text-[14px] font-bold tabular-nums">${subtotal > 0 ? rupiah(subtotal) : 'Request custom'}</span>
        </button>
      </div>`}

      ${toast && html`<div className="pointer-events-none fixed inset-x-0 top-16 z-[60] flex justify-center px-4" style=${{ paddingTop: 'env(safe-area-inset-top, 0px)' }}>
        <div className="toast flex max-w-sm items-center gap-2 rounded-xl bg-ann px-4 py-2.5 text-[13px] font-medium text-stone-100 shadow-lg" role="status">
          <${Icon} name="Check" size=${16} /> <span className="min-w-0">${toast}</span>
        </div>
      </div>`}

      <${CartDrawer} products=${products} open=${open} cart=${{ items: items, customs: customs }} onClose=${function () { setOpen(false); }}
        onQty=${changeQty} onRemove=${removeItem} onRemoveCustom=${removeCustom} />
    </div>`;
  }

  class Boundary extends React.Component {
    constructor(p) { super(p); this.state = { err: null }; }
    static getDerivedStateFromError(e) { return { err: e }; }
    render() {
      if (this.state.err) {
        return React.createElement('div', { style: { padding: 24, fontFamily: 'system-ui, sans-serif' } },
          React.createElement('h2', null, 'Terjadi error di aplikasi'),
          React.createElement('pre', { style: { whiteSpace: 'pre-wrap', fontSize: 12 } }, String((this.state.err && (this.state.err.stack || this.state.err.message)) || this.state.err)));
      }
      return this.props.children;
    }
  }
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(Boundary, null, React.createElement(App)));
})();
</script>

</body>
</html>
